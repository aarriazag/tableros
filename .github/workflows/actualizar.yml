name: Actualizar datos del tablero

on:
  schedule:
    - cron: "*/7 * * * *"   # cada 7 minutos (GitHub no permite menos de 5 y a veces se retrasa)
  workflow_dispatch:          # botón "Run workflow" para actualizar al momento

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - name: Leer SimpliRoute y cifrar los datos
        env:
          SR_TOKEN: ${{ secrets.SR_TOKEN }}
          CLAVE: ${{ secrets.CLAVE }}
        run: python generar.py
      - name: Publicar el archivo cifrado en la rama datos
        run: |
          cd site
          git init -q
          git checkout -q -b datos
          git config user.name "tablero-bot"
          git config user.email "tablero-bot@users.noreply.github.com"
          git add datos.bin
          git commit -q -m "datos $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos
